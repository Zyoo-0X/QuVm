name: QuVm Build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - name: Rebuild engine kernels 36 and 37 from native/ (16 KB-aligned address-space reservations)
        run: |
          export NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          test -d "$NDK" || { echo "NDK not found"; exit 1; }
          sh native/guest64/build.sh 36
          sh native/guest64/build.sh 37
          ls -l app/src/main/jniLibs/arm64-v8a/libaemu64_36.so app/src/main/jniLibs/arm64-v8a/libaemu64_37.so
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QuVm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
